<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .form-content {
      padding: 30px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .routes-list {
      margin: 20px 0;
    }

    .route-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }

    .route-item:hover {
      border-color: #f093fb;
      background: #fff;
    }

    .route-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #f093fb;
      cursor: pointer;
    }

    .route-info {
      flex: 1;
    }

    .route-id {
      font-size: 16px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 5px;
    }

    .route-details {
      font-size: 13px;
      color: #718096;
    }

    .route-stats {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #4a5568;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .select-all-btn {
      display: inline-block;
      padding: 8px 16px;
      background: #f8f9fa;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 15px;
    }

    .select-all-btn:hover {
      background: #fff;
      border-color: #f093fb;
      color: #f093fb;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .button-container {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      padding: 20px 30px;
      background: #f7fafc;
      border-top: 1px solid #e2e8f0;
    }

    button {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: white;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #f7fafc;
      border-color: #cbd5e0;
    }

    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert-success {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid #38a169;
    }

    .alert-error {
      background: #fed7d7;
      color: #742a2a;
      border-left: 4px solid #e53e3e;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #f093fb;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #4a5568;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .loading-details {
      font-size: 13px;
      color: #718096;
    }

    .results {
      display: none;
      padding: 30px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .label {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>🛣️ Générer les Étapes</h1>
        <p>Optimiser l'ordre et envoyer les itinéraires aux bénévoles</p>
      </div>

      <div class="form-content">
        <div id="alert-success" class="alert alert-success"></div>
        <div id="alert-error" class="alert alert-error"></div>
      </div>

      <form id="stopsForm">
        <div class="form-content">
          <div class="section-title">
            📍 Sélectionner les Routes à Traiter
          </div>

          <div id="routes-container">
            <div class="loading" style="display: block;">
              <div class="spinner"></div>
              <div class="loading-text">Chargement des routes...</div>
            </div>
          </div>

        </div>

        <div class="button-container">
          <button type="button" class="btn-secondary" onclick="closeDialog()">
            Annuler
          </button>
          <button type="submit" class="btn-primary" id="submitBtn" disabled>
            ✨ Générer et Envoyer
          </button>
        </div>
      </form>

      <!-- Loading génération -->
      <div id="loading-generation" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Génération en cours...</div>
        <div class="loading-details">
          Optimisation TSP, création documents Google et envoi emails
        </div>
      </div>

      <!-- Résultats -->
      <div id="results" class="results">
        <div style="text-align: center; margin-bottom: 30px;">
          <h2>✅ Étapes Générées et Envoyées</h2>
        </div>

        <div class="stat-cards">
          <div class="stat-card">
            <div class="number" id="stat-processed">0</div>
            <div class="label">Routes Traitées</div>
          </div>
          <div class="stat-card">
            <div class="number" id="stat-errors">0</div>
            <div class="label">Erreurs</div>
          </div>
        </div>

        <div class="button-container">
          <button type="button" class="btn-primary" onclick="closeDialog()">
            Fermer
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let routes = [];

    window.addEventListener('load', function () {
      loadDraftRoutes();
    });

    function loadDraftRoutes() {
      google.script.run
        .withSuccessHandler(displayRoutes)
        .withFailureHandler(onLoadError)
        .getDraftRoutesForForm();
    }

    function displayRoutes(data) {
      routes = data;
      const container = document.getElementById('routes-container');

      if (!routes || routes.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 48px; margin-bottom: 20px;">📭</div>
            <h3>Aucune route en brouillon</h3>
            <p style="margin-top: 10px;">
              Créez d'abord des routes via "Planifier Routes"
            </p>
          </div>
        `;
        return;
      }

      let html = `
        <div class="select-all-btn" onclick="toggleSelectAll()">
          ✓ Tout sélectionner / désélectionner
        </div>
        <div class="routes-list">
      `;

      routes.forEach((route, index) => {
        html += `
          <div class="route-item" onclick="toggleRoute(${index}, event)">
            <input 
              type="checkbox" 
              id="route-${index}" 
              value="${route.id_route}"
              onchange="updateSubmitButton()"
            >
            <div class="route-info">
              <div class="route-id">${route.id_route}</div>
              <div class="route-details">
                Bénévole: ${route.benevole_nom || route.id_benevole}
              </div>
              <div class="route-stats">
                <div class="stat">
                  <span>📦</span>
                  <span>${route.nombre_livraisons || 0} livraisons</span>
                </div>
                <div class="stat">
                  <span>📏</span>
                  <span>${route.distance_totale_km} km</span>
                </div>
                <div class="stat">
                  <span>⚖️</span>
                  <span>${route.poids_total_kg} kg</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;

      // Sélectionner toutes les routes par défaut
      toggleSelectAll();
    }

    function onLoadError(error) {
      const container = document.getElementById('routes-container');
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size: 48px; margin-bottom: 20px; color: #e53e3e;">⚠️</div>
          <h3>Erreur de chargement</h3>
          <p style="margin-top: 10px; color: #742a2a;">
            ${error.message}
          </p>
        </div>
      `;
    }

    function toggleRoute(index, event) {
      if (event.target.type !== 'checkbox') {
        const checkbox = document.getElementById(`route-${index}`);
        checkbox.checked = !checkbox.checked;
        updateSubmitButton();
      }
    }

    function toggleSelectAll() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
      });

      updateSubmitButton();
    }

    function updateSubmitButton() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = checkboxes.length === 0;
    }

    document.getElementById('stopsForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      const routeIds = Array.from(checkboxes).map(cb => cb.value);

      if (routeIds.length === 0) {
        showAlert('error', 'Veuillez sélectionner au moins une route');
        return;
      }

      // Afficher le loader
      document.getElementById('stopsForm').style.display = 'none';
      document.getElementById('loading-generation').style.display = 'block';

      // Appeler la fonction backend
      google.script.run
        .withSuccessHandler(onGenerateSuccess)
        .withFailureHandler(onGenerateError)
        .generateStopsFromForm(routeIds);
    });

    function onGenerateSuccess(result) {
      document.getElementById('loading-generation').style.display = 'none';

      if (!result.success) {
        document.getElementById('stopsForm').style.display = 'block';
        showAlert('error', 'La génération a échoué : ' + (result.errors.join(', ') || 'Erreur inconnue'));
        return;
      }

      // Afficher les résultats
      document.getElementById('stat-processed').textContent = result.processed;
      document.getElementById('stat-errors').textContent = result.errors.length;

      document.getElementById('results').style.display = 'block';
    }

    function onGenerateError(error) {
      document.getElementById('loading-generation').style.display = 'none';
      document.getElementById('stopsForm').style.display = 'block';
      showAlert('error', 'Erreur : ' + error.message);
    }

    function showAlert(type, message) {
      const alertId = 'alert-' + type;
      const alert = document.getElementById(alertId);
      alert.textContent = message;
      alert.style.display = 'block';

      setTimeout(function () {
        alert.style.display = 'none';
      }, 5000);
    }

    function closeDialog() {
      google.script.host.close();
    }
  </script>
</body>

</html>
