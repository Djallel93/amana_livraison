<script>
  var _etapeCourante = 1;
  var _tousBenevoles = [];
  var _toutesLivraisons = [];
  var _benevoleSelectionne = null;
  var _livraisonsSelectionnees = new Set();

  var PRIO_COULEURS = {
    1: "#ef4444",
    2: "#f97316",
    3: "#eab308",
    4: "#3b82f6",
    5: "#94a3b8",
  };

  window.addEventListener("load", function () {
    var demain = new Date();
    demain.setDate(demain.getDate() + 1);
    document.getElementById("date_livraison").value = demain
      .toISOString()
      .split("T")[0];
    chargerBenevoles(false);
  });

  // ============================================================
  // NAVIGATION
  // ============================================================

  function goToStep(n) {
    document.getElementById("step" + _etapeCourante).style.display = "none";
    document.getElementById("step" + _etapeCourante).classList.remove("active");
    _etapeCourante = n;
    var panel = document.getElementById("step" + n);
    panel.style.display = "flex";
    panel.classList.add("active");
    [1, 2, 3].forEach(function (i) {
      var btn = document.getElementById("stepBtn" + i);
      btn.classList.remove("active", "done");
      if (i < n) btn.classList.add("done");
      if (i === n) btn.classList.add("active");
    });
  }

  function afficherEtatChargement(visible) {
    var loading = document.getElementById("loadingState");
    var stepNav = document.getElementById("stepNav");
    var panel = document.getElementById("step" + _etapeCourante);
    if (visible) {
      panel.style.display = "none";
      stepNav.style.display = "none";
      loading.style.display = "flex";
    } else {
      loading.style.display = "none";
      stepNav.style.display = "";
      panel.style.display = "flex";
    }
  }

  function afficherResultats(result) {
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("stepNav").style.display = "none";
    document.getElementById("step" + _etapeCourante).style.display = "none";

    document.getElementById("res-route").textContent = result.id_route;
    document.getElementById("res-livraisons").textContent =
      result.nb_livraisons;
    document.getElementById("res-poids").textContent =
      Math.round(result.poids_total_kg) + " kg";
    document.getElementById("res-distance").textContent =
      Math.round(result.distance_totale_km * 10) / 10 + " km";
    document.getElementById("results-subtitle").textContent =
      "Route " + result.id_route + " assignée à " + result.benevole_nom;

    if (result.lien_maps) {
      document.getElementById("res-maps-link").href = result.lien_maps;
      document.getElementById("res-maps-wrap").style.display = "";
    }
    if (result.doc_warning) {
      var warn = document.getElementById("res-warning");
      warn.textContent = "⚠️ " + result.doc_warning;
      warn.style.display = "flex";
      warn.classList.add("alert--visible");
    }

    document.getElementById("resultsState").style.display = "flex";
    document
      .getElementById("resultsState")
      .classList.add("results-state--visible");
  }

  // ============================================================
  // ÉTAPE 1 — CONFIGURATION
  // ============================================================

  function validerEtape1() {
    var date = document.getElementById("date_livraison").value;
    if (!date) {
      showAlert(1, "Veuillez sélectionner une date de livraison.");
      return;
    }
    document.getElementById("stepBtn2").disabled = false;
    goToStep(2);
  }

  // ============================================================
  // ÉTAPE 2 — BÉNÉVOLES
  // ============================================================

  function chargerBenevoles(forceRefresh) {
    document.getElementById("benevoles-wrap-manual").innerHTML =
      '<div class="loading-state loading-state--visible" style="padding:32px 0;"><div class="spinner"></div>' +
      '<div class="loading-state__text">' +
      (forceRefresh ? "Actualisation…" : "Chargement…") +
      "</div></div>";
    document.getElementById("btn-refresh-manual").disabled = true;

    google.script.run
      .withSuccessHandler(function (benevoles) {
        _tousBenevoles = benevoles;
        filtrerBenevoles();
        document.getElementById("btn-refresh-manual").disabled = false;
      })
      .withFailureHandler(function (e) {
        document.getElementById("benevoles-wrap-manual").innerHTML =
          '<div style="padding:20px;text-align:center;color:var(--error-text);">Erreur : ' +
          e.message +
          "</div>";
        document.getElementById("btn-refresh-manual").disabled = false;
      })
      .getVolunteersForPlanningForm(null, forceRefresh);
  }

  function actualiserBenevoles() {
    document.getElementById("btn-refresh-manual").disabled = true;
    google.script.run
      .withSuccessHandler(function () {
        chargerBenevoles(true);
      })
      .withFailureHandler(function (e) {
        document.getElementById("btn-refresh-manual").disabled = false;
        showAlert(2, "Erreur actualisation : " + e.message);
      })
      .invalidateBenevolesUserCache();
  }

  function filtrerBenevoles() {
    var filtreDispo = document.getElementById("filtre-dispo-benv").value;
    var afficherAdmins = document.getElementById("filtre-admin-benv").checked;
    var filtres = _tousBenevoles.filter(function (b) {
      if (!afficherAdmins && b.admin) return false;
      if (filtreDispo && !b.disponibilites.includes(filtreDispo)) return false;
      return true;
    });
    renderBenevoles(filtres);
  }

  function renderBenevoles(benevoles) {
    var wrap = document.getElementById("benevoles-wrap-manual");
    document.getElementById("benevoles-counter-manual").textContent =
      benevoles.length + " bénévole" + (benevoles.length > 1 ? "s" : "");

    if (benevoles.length === 0) {
      wrap.innerHTML =
        '<div style="padding:24px;text-align:center;color:var(--muted);">Aucun bénévole</div>';
      return;
    }

    var html = '<table class="deliveries-table"><thead><tr>';
    html +=
      "<th></th><th>Bénévole</th><th>Disponibilités</th><th>Véhicule</th><th>Capacité</th><th>Route aujourd'hui</th><th>Fait</th>";
    html += "</tr></thead><tbody>";

    benevoles.forEach(function (b) {
      var isSelected =
        _benevoleSelectionne &&
        String(_benevoleSelectionne.id) === String(b.id);
      var dispoTags =
        (b.disponibilites || [])
          .map(function (d) {
            return (
              '<span style="font-size:10px;padding:1px 6px;border-radius:20px;background:rgba(0,254,207,.15);color:var(--c2);margin-right:3px;font-weight:600;">' +
              d +
              "</span>"
            );
          })
          .join("") ||
        '<span style="color:var(--muted-light);font-size:11px;">—</span>';

      var routeLabel = "—";
      var s = (b.route_statut || "").toLowerCase();
      if (b.has_route_today) {
        var bg = "#fef3c7",
          col = "#d97706";
        if (s.indexOf("termin") !== -1) {
          bg = "#d1fae5";
          col = "#059669";
        }
        routeLabel =
          '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:' +
          bg +
          ";color:" +
          col +
          ';">' +
          (b.route_statut || "?") +
          "</span>";
      }

      var nomLabel = b.prenom + " " + b.nom;
      if (b.admin)
        nomLabel +=
          ' <span style="font-size:10px;padding:1px 6px;border-radius:20px;background:#ede9fe;color:#6d28d9;font-weight:600;">admin</span>';
      if (b.is_tmp_vehicle) nomLabel += " 🔑";

      html +=
        '<tr class="' +
        (isSelected ? "selected" : "") +
        '" onclick="selectionnerBenevole(' +
        JSON.stringify(b).replace(/"/g, "&quot;") +
        ', this)">';
      html +=
        '<td><input type="radio" name="benevole_radio" value="' +
        b.id +
        '" ' +
        (isSelected ? "checked" : "") +
        ' style="accent-color:var(--c2);"></td>';
      html += "<td><strong>" + nomLabel + "</strong></td>";
      html += "<td>" + dispoTags + "</td>";
      html += "<td>" + (b.vehicule_type || "—") + "</td>";
      html +=
        '<td class="mono">' +
        (b.vehicule_capacite ? b.vehicule_capacite + " kg" : "—") +
        "</td>";
      html += "<td>" + routeLabel + "</td>";
      html +=
        '<td class="mono">' +
        (b.has_route_today ? b.livraisons_faites : "—") +
        "</td>";
      html += "</tr>";
    });

    html += "</tbody></table>";
    wrap.innerHTML = html;
  }

  function selectionnerBenevole(benevole, tr) {
    _benevoleSelectionne = benevole;
    document
      .querySelectorAll("#benevoles-wrap-manual tbody tr")
      .forEach(function (row) {
        row.classList.remove("selected");
      });
    tr.classList.add("selected");
    var radio = tr.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;

    document.getElementById("benevole-summary").style.display = "flex";
    document.getElementById("benevole-selected-nom").textContent =
      benevole.prenom + " " + benevole.nom;
    document.getElementById("benevole-selected-vehicule").textContent =
      (benevole.vehicule_type || "—") +
      " · " +
      (benevole.vehicule_capacite || "—") +
      " kg";
    document.getElementById("btnStep2Next").disabled = false;
  }

  function validerEtape2() {
    if (!_benevoleSelectionne) {
      showAlert(2, "Veuillez sélectionner un bénévole.");
      return;
    }
    document.getElementById("stepBtn3").disabled = false;
    chargerLivraisonsAvecCluster();
    goToStep(3);
  }

  // ============================================================
  // ÉTAPE 3 — LIVRAISONS AVEC CLUSTER PRÉ-COCHÉ
  // ============================================================

  function chargerLivraisonsAvecCluster() {
    var date = document.getElementById("date_livraison").value;
    document.getElementById("livraisons-wrap").innerHTML =
      '<div class="loading-state loading-state--visible" style="padding:32px 0;">' +
      '<div class="spinner"></div><div class="loading-state__text">Calcul du cluster optimal…</div></div>';

    var params = {
      date: date,
      id_benevole: _benevoleSelectionne.id,
      poids_moyen_kg:
        parseFloat(document.getElementById("poids_moyen_kg").value) || 15,
      poids_moyen_hotel_kg:
        parseFloat(document.getElementById("poids_moyen_hotel_kg").value) || 10,
    };

    google.script.run
      .withSuccessHandler(function (data) {
        _toutesLivraisons = data.all_livraisons;
        _livraisonsSelectionnees = new Set(data.cluster_ids);
        peuplerFiltreQuartier(_toutesLivraisons);
        filtrerLivraisons();

        if (data.cluster_ids.length > 0) {
          showInfo3(
            "✅ " +
              data.cluster_ids.length +
              " livraison(s) du cluster le plus éloigné pré-sélectionnées. Vous pouvez modifier la sélection.",
          );
        } else {
          showInfo3(
            "ℹ️ Aucun cluster compatible avec ce véhicule. Sélectionnez les livraisons manuellement.",
          );
        }
      })
      .withFailureHandler(function (e) {
        // Fallback : charger toutes les livraisons sans pré-sélection
        google.script.run
          .withSuccessHandler(function (livraisons) {
            _toutesLivraisons = livraisons;
            _livraisonsSelectionnees = new Set();
            peuplerFiltreQuartier(livraisons);
            filtrerLivraisons();
            showInfo3("⚠️ Cluster non calculé. Sélectionnez manuellement.");
          })
          .withFailureHandler(function (e2) {
            document.getElementById("livraisons-wrap").innerHTML =
              '<div style="padding:20px;text-align:center;color:var(--error-text);">Erreur : ' +
              e2.message +
              "</div>";
          })
          .getDeliveriesForManualRoute(date);
      })
      .getClusterForDriver(params);
  }

  function peuplerFiltreQuartier(livraisons) {
    var quartiers = {};
    livraisons.forEach(function (l) {
      if (l.id_quartier) quartiers[l.id_quartier] = true;
    });
    var select = document.getElementById("filtre-quartier");
    select.innerHTML = '<option value="">Tous les quartiers</option>';
    Object.keys(quartiers)
      .sort()
      .forEach(function (q) {
        var opt = document.createElement("option");
        opt.value = q;
        opt.textContent = q;
        select.appendChild(opt);
      });
  }

  function filtrerLivraisons() {
    var filtreQuartier = document.getElementById("filtre-quartier").value;
    var filtrees = _toutesLivraisons.filter(function (l) {
      return !filtreQuartier || l.id_quartier === filtreQuartier;
    });
    renderLivraisons(filtrees);
  }

  function renderLivraisons(livraisons) {
    var wrap = document.getElementById("livraisons-wrap");
    document.getElementById("livraisons-counter").textContent =
      livraisons.length + " livraison" + (livraisons.length > 1 ? "s" : "");

    if (livraisons.length === 0) {
      wrap.innerHTML =
        '<div class="empty-state" style="padding:40px 20px;"><div class="empty-state__icon">📭</div><h3>Aucune livraison disponible</h3></div>';
      mettreAJourSommaire();
      return;
    }

    var html = '<table class="deliveries-table"><thead><tr>';
    html +=
      "<th></th><th>ID Famille</th><th>Adresse</th><th>Quartier</th><th>Personnes</th><th>Prio</th><th>Cluster</th>";
    html += "</tr></thead><tbody>";

    livraisons.forEach(function (l) {
      var isChecked = _livraisonsSelectionnees.has(l.id_livraison);
      var prioCouleur = PRIO_COULEURS[l.priorite] || "#94a3b8";
      var hotelBadge = l.hotel
        ? ' <span style="font-size:10px;padding:1px 6px;border-radius:20px;background:#e0f2fe;color:#0369a1;font-weight:600;">🏨 Hôtel</span>'
        : "";
      var clusterBadge = isChecked
        ? '<span style="font-size:10px;padding:1px 6px;border-radius:20px;background:rgba(0,254,207,.15);color:var(--c2);font-weight:600;">📍 Cluster</span>'
        : "";

      html +=
        '<tr class="' +
        (isChecked ? "selected" : "") +
        '" onclick="toggleLivraison(\'' +
        l.id_livraison +
        "', this)\">";
      html +=
        '<td><input type="checkbox" class="livraison-cb" value="' +
        l.id_livraison +
        '" ' +
        (isChecked ? "checked" : "") +
        ' style="accent-color:var(--c2);" onclick="event.stopPropagation(); toggleLivraison(\'' +
        l.id_livraison +
        "', this.closest('tr'))\"></td>";
      html += "<td><strong>" + l.id_famille + "</strong></td>";
      html += "<td>" + l.adresse + hotelBadge + "</td>";
      html += "<td>" + (l.id_quartier || "—") + "</td>";
      html += '<td class="mono">' + l.nombre_personnes + "</td>";
      html +=
        '<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' +
        prioCouleur +
        ';margin-right:4px;vertical-align:middle;"></span>' +
        l.priorite +
        "</td>";
      html += "<td>" + clusterBadge + "</td>";
      html += "</tr>";
    });

    html += "</tbody></table>";
    wrap.innerHTML = html;
    mettreAJourSommaire();
  }

  function toggleLivraison(id, tr) {
    if (_livraisonsSelectionnees.has(id)) {
      _livraisonsSelectionnees.delete(id);
      tr.classList.remove("selected");
      var cb = tr.querySelector(".livraison-cb");
      if (cb) cb.checked = false;
    } else {
      _livraisonsSelectionnees.add(id);
      tr.classList.add("selected");
      var cb = tr.querySelector(".livraison-cb");
      if (cb) cb.checked = true;
    }
    mettreAJourSommaire();
  }

  function toggleToutesLivraisons(checked) {
    var filtreQuartier = document.getElementById("filtre-quartier").value;
    var filtrees = _toutesLivraisons.filter(function (l) {
      return !filtreQuartier || l.id_quartier === filtreQuartier;
    });
    filtrees.forEach(function (l) {
      if (checked) _livraisonsSelectionnees.add(l.id_livraison);
      else _livraisonsSelectionnees.delete(l.id_livraison);
    });
    document.querySelectorAll(".livraison-cb").forEach(function (cb) {
      cb.checked = checked;
      cb.closest("tr").classList.toggle("selected", checked);
    });
    mettreAJourSommaire();
  }

  /**
   * Met à jour la barre de sommaire avec le poids sélectionné
   * et affiche un avertissement si la capacité du véhicule est dépassée.
   */
  function mettreAJourSommaire() {
    var count = _livraisonsSelectionnees.size;
    document.getElementById("livraisons-selected-count").textContent = count;
    document.getElementById("btnCreer").disabled = count === 0;

    var poidsDom =
      parseFloat(document.getElementById("poids_moyen_kg").value) || 0;
    var poidsHot =
      parseFloat(document.getElementById("poids_moyen_hotel_kg").value) ||
      poidsDom;

    var poidsTotal = 0;
    var partsTotal = 0;
    _livraisonsSelectionnees.forEach(function (id) {
      var liv = _toutesLivraisons.find(function (l) {
        return l.id_livraison === id;
      });
      if (liv) {
        var parts = parseInt(liv.nombre_personnes) || 0;
        partsTotal += parts;
        poidsTotal += parts * (liv.hotel ? poidsHot : poidsDom);
      }
    });

    var capaciteKg = _benevoleSelectionne
      ? _benevoleSelectionne.vehicule_capacite || 0
      : 0;
    var partsMax = _benevoleSelectionne
      ? _benevoleSelectionne.vehicule_parts_max || 0
      : 0;

    var poidsLabel =
      count > 0 && poidsTotal > 0 ? "≈ " + Math.round(poidsTotal) + " kg" : "";
    document.getElementById("livraisons-selected-poids").textContent =
      poidsLabel;

    // Barre capacité véhicule
    var barEl = document.getElementById("capacite-bar");
    if (capaciteKg > 0 && count > 0) {
      var pct = Math.min((poidsTotal / capaciteKg) * 100, 100);
      var depasse =
        poidsTotal > capaciteKg || (partsMax > 0 && partsTotal > partsMax);

      var couleur = depasse ? "#ef4444" : pct > 80 ? "#f97316" : "#10b981";
      var texte = depasse
        ? "⚠️ Capacité dépassée : " +
          Math.round(poidsTotal) +
          " kg / " +
          capaciteKg +
          " kg"
        : "🚗 Poids : " +
          Math.round(poidsTotal) +
          " kg / " +
          capaciteKg +
          " kg (" +
          Math.round(pct) +
          "%)";
      if (partsMax > 0) texte += " · Parts : " + partsTotal + " / " + partsMax;

      barEl.style.display = "flex";
      barEl.style.background = depasse ? "#fee2e2" : "#f0fdf4";
      barEl.style.color = depasse ? "#7f1d1d" : "#065f46";
      barEl.style.borderColor = depasse ? "#fca5a5" : "#6ee7b7";
      barEl.querySelector(".cap-barre-fill").style.width = pct + "%";
      barEl.querySelector(".cap-barre-fill").style.background = couleur;
      barEl.querySelector(".cap-texte").textContent = texte;
    } else {
      barEl.style.display = "none";
    }
  }

  // ============================================================
  // CRÉATION DE LA ROUTE
  // ============================================================

  function creerRoute() {
    if (!_benevoleSelectionne) {
      showAlert(3, "Aucun bénévole sélectionné.");
      return;
    }
    if (_livraisonsSelectionnees.size === 0) {
      showAlert(3, "Aucune livraison sélectionnée.");
      return;
    }

    var params = {
      id_benevole: _benevoleSelectionne.id,
      livraison_ids: Array.from(_livraisonsSelectionnees),
      date_livraison: document.getElementById("date_livraison").value,
      occasion: document.getElementById("occasion").value,
      poids_moyen_kg:
        parseFloat(document.getElementById("poids_moyen_kg").value) || 15,
      poids_moyen_hotel_kg:
        parseFloat(document.getElementById("poids_moyen_hotel_kg").value) || 10,
    };

    afficherEtatChargement(true);

    google.script.run
      .withSuccessHandler(afficherResultats)
      .withFailureHandler(function (e) {
        afficherEtatChargement(false);
        showAlert(3, "Erreur lors de la création : " + e.message);
      })
      .createManualRouteFromForm(params);
  }

  // ============================================================
  // UTILITAIRES
  // ============================================================

  function showAlert(step, msg) {
    var el = document.getElementById("alert-error-" + step);
    if (!el) return;
    el.textContent = msg;
    el.classList.add("alert--visible", "alert--error");
    setTimeout(function () {
      el.classList.remove("alert--visible");
    }, 6000);
  }

  function showInfo3(msg) {
    var el = document.getElementById("info-cluster");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
  }
</script>
