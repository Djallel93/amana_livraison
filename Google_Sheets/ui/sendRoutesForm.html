<!doctype html>
<html lang="fr">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <?!= include('styles'); ?>
  </head>

  <body>
    <div class="page-wrap">
      <div class="card">
        <div class="form-header">
          <div class="form-header__icon">✉️</div>
          <div class="form-header__text">
            <h1>Envoyer les Itinéraires</h1>
            <p>Sélectionnez les routes à envoyer aux bénévoles</p>
          </div>
        </div>

        <!-- FORM STATE -->
        <div id="formState">
          <div class="form-body">
            <div id="alert-success" class="alert alert--success"></div>
            <div id="alert-error" class="alert alert--error"></div>
            <div id="alert-info" class="alert alert--info"></div>

            <div class="toolbar">
              <div class="toolbar__title" id="routeCount">Chargement…</div>
              <button type="button" class="text-link" onclick="toggleAll()">
                ✓ Tout sélectionner / désélectionner
              </button>
            </div>

            <div class="scroll-list" id="routesList">
              <div
                class="loading-state loading-state--visible"
                style="padding: 32px 0"
              >
                <div class="spinner"></div>
              </div>
            </div>

            <div class="preview-bar" id="previewBar"></div>
          </div>

          <div class="form-footer">
            <button
              type="button"
              class="btn btn--secondary"
              onclick="google.script.host.close()"
            >
              Annuler
            </button>
            <button
              type="button"
              class="btn btn--primary"
              id="sendBtn"
              disabled
              onclick="send()"
            >
              ✉️ Envoyer les emails
            </button>
          </div>
        </div>

        <!-- LOADING STATE -->
        <div id="loadingState" class="loading-state">
          <div class="spinner"></div>
          <div class="loading-state__text">Envoi des emails en cours…</div>
          <div class="loading-state__sub">
            Récupération des familles et génération des emails
          </div>
        </div>

        <!-- RESULTS STATE -->
        <div id="resultsState" class="results-state">
          <div class="results-header">
            <h2>✅ Emails envoyés</h2>
          </div>
          <div class="results-body">
            <div class="kpi-grid" id="resultStats"></div>
            <div id="errorsBox" class="error-box hidden">
              <div class="error-box__title">⚠️ Erreurs</div>
              <ul id="errorsList"></ul>
            </div>
          </div>
          <div class="form-footer">
            <button
              type="button"
              class="btn btn--primary"
              onclick="google.script.host.close()"
            >
              Fermer
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      var routes = [];

      window.addEventListener("load", function () {
        google.script.run
          .withSuccessHandler(renderRoutes)
          .withFailureHandler(function (e) {
            showAlert("error", "Erreur de chargement : " + e.message);
          })
          .getConfirmedRoutesForSending();
      });

      function renderRoutes(data) {
        routes = data || [];
        var list = document.getElementById("routesList");
        document.getElementById("routeCount").textContent =
          routes.length +
          " route" +
          (routes.length > 1 ? "s" : "") +
          " confirmée" +
          (routes.length > 1 ? "s" : "");

        if (routes.length === 0) {
          list.innerHTML =
            '<div class="empty-state"><div class="empty-state__icon">📭</div><h3>Aucune route confirmée</h3><p>Confirmez d\'abord des routes dans la feuille "routes" (statut = Confirmée) avant d\'envoyer les emails.</p></div>';
          return;
        }

        list.innerHTML = routes
          .map(function (r, i) {
            return (
              '<div class="route-card" id="card-' +
              i +
              '" onclick="toggleCard(' +
              i +
              ')">' +
              '<input type="checkbox" id="chk-' +
              i +
              '" value="' +
              r.id_route +
              '" onchange="onCheck()">' +
              '<div class="route-card__info">' +
              '<div class="route-card__id">' +
              r.id_route +
              "</div>" +
              '<div class="route-card__meta">' +
              '<span class="route-card__badge">👤 ' +
              (r.benevole_nom || r.id_benevole || "—") +
              "</span>" +
              '<span class="route-card__badge">📦 ' +
              r.nombre_livraisons +
              " livraison" +
              (r.nombre_livraisons > 1 ? "s" : "") +
              "</span>" +
              '<span class="route-card__badge">📏 ' +
              r.distance_km +
              " km</span>" +
              (r.date_debut
                ? '<span class="route-card__badge">📅 ' +
                  formatDate(r.date_debut) +
                  "</span>"
                : "") +
              "</div>" +
              "</div>" +
              '<span class="route-card__status">Confirmée</span>' +
              "</div>"
            );
          })
          .join("");

        onCheck();
      }

      function toggleCard(i) {
        var chk = document.getElementById("chk-" + i);
        chk.checked = !chk.checked;
        onCheck();
      }

      function toggleAll() {
        var boxes = document.querySelectorAll(
          '#routesList input[type="checkbox"]',
        );
        var allChecked = Array.from(boxes).every(function (b) {
          return b.checked;
        });
        boxes.forEach(function (b) {
          b.checked = !allChecked;
        });
        onCheck();
      }

      function onCheck() {
        var selected = getSelectedIds();
        document.getElementById("sendBtn").disabled = selected.length === 0;

        routes.forEach(function (_, i) {
          var chk = document.getElementById("chk-" + i);
          var card = document.getElementById("card-" + i);
          if (chk && card) card.classList.toggle("selected", chk.checked);
        });

        var bar = document.getElementById("previewBar");
        if (selected.length > 0) {
          var totalDel = selected.reduce(function (sum, id) {
            var r = routes.find(function (x) {
              return x.id_route === id;
            });
            return sum + (r ? r.nombre_livraisons : 0);
          }, 0);
          bar.style.display = "block";
          bar.textContent =
            "📬 " +
            selected.length +
            " email" +
            (selected.length > 1 ? "s" : "") +
            " · " +
            totalDel +
            " livraison" +
            (totalDel > 1 ? "s" : "") +
            " au total";
        } else {
          bar.style.display = "none";
        }
      }

      function send() {
        var ids = getSelectedIds();
        if (ids.length === 0) return;
        setState("loading");
        google.script.run
          .withSuccessHandler(showResults)
          .withFailureHandler(function (e) {
            setState("form");
            showAlert("error", "Erreur : " + e.message);
          })
          .sendRouteEmails(ids);
      }

      function showResults(result) {
        document.getElementById("resultStats").innerHTML =
          '<div class="kpi-card"><div class="kpi-card__value">' +
          result.sent +
          '</div><div class="kpi-card__label">Email' +
          (result.sent > 1 ? "s" : "") +
          " envoyé" +
          (result.sent > 1 ? "s" : "") +
          "</div></div>" +
          '<div class="kpi-card"><div class="kpi-card__value">' +
          result.errors.length +
          '</div><div class="kpi-card__label">Erreur' +
          (result.errors.length > 1 ? "s" : "") +
          "</div></div>";
        if (result.errors.length > 0) {
          var ul = document.getElementById("errorsList");
          ul.innerHTML = result.errors
            .map(function (e) {
              return "<li>" + e + "</li>";
            })
            .join("");
          document.getElementById("errorsBox").classList.remove("hidden");
        }
        setState("results");
      }

      function getSelectedIds() {
        return Array.from(
          document.querySelectorAll("#routesList input:checked"),
        ).map(function (b) {
          return b.value;
        });
      }

      function formatDate(dateStr) {
        try {
          return new Date(dateStr).toLocaleDateString("fr-FR", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          });
        } catch (_) {
          return dateStr;
        }
      }

      function setState(s) {
        document.getElementById("formState").style.display =
          s === "form" ? "" : "none";
        document
          .getElementById("loadingState")
          .classList.toggle("loading-state--visible", s === "loading");
        document
          .getElementById("resultsState")
          .classList.toggle("results-state--visible", s === "results");
      }

      function showAlert(type, msg) {
        var el = document.getElementById("alert-" + type);
        el.textContent = msg;
        el.classList.add("alert--visible", "alert--" + type);
        setTimeout(function () {
          el.classList.remove("alert--visible");
        }, 6000);
      }
    </script>
  </body>
</html>
