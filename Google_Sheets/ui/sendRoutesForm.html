<!DOCTYPE html>
<html lang="fr">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoyer les itinéraires</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #4facfe;
            --primary-2: #00f2fe;
            --success: #38a169;
            --danger: #e53e3e;
            --text: #2d3748;
            --muted: #718096;
            --border: #e2e8f0;
            --bg: #f7fafc;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Layout ─────────────────────────────────────────── */
        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #fff;
            padding: 36px 40px 28px;
            text-align: center;
        }

        .header .icon {
            font-size: 44px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            opacity: .88;
            font-size: 14px;
        }

        /* ── Body ────────────────────────────────────────────── */
        .body {
            padding: 36px 40px;
        }

        /* ── Alerts ─────────────────────────────────────────── */
        .alert {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            border-left: 4px solid;
            animation: slideDown .25s ease;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-color: var(--success);
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border-color: var(--danger);
        }

        .alert-info {
            background: #ebf8ff;
            color: #2c5282;
            border-color: var(--primary);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-8px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ── Toolbar ─────────────────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .select-all-btn {
            font-size: 13px;
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 4px 0;
            text-decoration: underline;
        }

        .select-all-btn:hover {
            color: #2c7dd6;
        }

        /* ── Route cards ─────────────────────────────────────── */
        .routes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .route-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color .18s, box-shadow .18s, background .18s;
            background: var(--bg);
        }

        .route-card:hover {
            border-color: var(--primary);
            background: #fff;
        }

        .route-card.selected {
            border-color: var(--primary);
            background: #ebf8ff;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, .15);
        }

        .route-card input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .route-info {
            flex: 1;
            min-width: 0;
        }

        .route-id {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .route-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .route-status {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: #c6f6d5;
            color: #22543d;
            flex-shrink: 0;
        }

        /* ── Empty state ─────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 56px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Preview bar ─────────────────────────────────────── */
        .preview-bar {
            display: none;
            margin-top: 24px;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        /* ── Loader ─────────────────────────────────────────── */
        .loading {
            display: none;
            text-align: center;
            padding: 56px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .85s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: var(--muted);
            font-size: 15px;
        }

        /* ── Results ─────────────────────────────────────────── */
        .results {
            display: none;
            padding: 40px;
            text-align: center;
        }

        .results h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            padding: 24px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #fff;
            text-align: center;
        }

        .stat-card .num {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-card .label {
            font-size: 13px;
            opacity: .9;
        }

        .errors-box {
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }

        .errors-box h4 {
            color: #c53030;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .errors-box ul {
            padding-left: 18px;
        }

        .errors-box li {
            color: #742a2a;
            font-size: 13px;
            margin-bottom: 4px;
        }

        /* ── Footer buttons ──────────────────────────────────── */
        .footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 24px 40px;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all .18s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(79, 172, 254, .35);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 172, 254, .45);
        }

        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #fff;
            color: var(--muted);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
            border-color: #cbd5e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <!-- HEADER -->
            <div class="header">
                <div class="icon">✉️</div>
                <h1>Envoyer les Itinéraires</h1>
                <p>Sélectionnez les routes à envoyer aux bénévoles</p>
            </div>

            <!-- FORM SECTION -->
            <div id="formSection">
                <div class="body">

                    <!-- Alertes -->
                    <div id="alertSuccess" class="alert alert-success"></div>
                    <div id="alertError" class="alert alert-error"></div>
                    <div id="alertInfo" class="alert alert-info"></div>

                    <!-- Toolbar -->
                    <div class="toolbar">
                        <div class="toolbar-title" id="routeCount">Chargement…</div>
                        <button class="select-all-btn" onclick="toggleAll()">
                            ✓ Tout sélectionner / désélectionner
                        </button>
                    </div>

                    <!-- Liste des routes -->
                    <div class="routes-list" id="routesList">
                        <div class="loading" style="display:block;">
                            <div class="spinner"></div>
                            <p>Chargement des routes confirmées…</p>
                        </div>
                    </div>

                    <!-- Preview bar -->
                    <div class="preview-bar" id="previewBar"></div>

                </div>

                <!-- Footer -->
                <div class="footer">
                    <button class="btn-secondary" onclick="closeDialog()">Annuler</button>
                    <button class="btn-primary" id="sendBtn" disabled onclick="send()">
                        ✉️ Envoyer les emails
                    </button>
                </div>
            </div>

            <!-- LOADING ENVOI -->
            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <p>Envoi des emails en cours…<br>
                    <small style="color:#a0aec0;">Récupération des familles et génération des emails</small>
                </p>
            </div>

            <!-- RESULTS -->
            <div class="results" id="resultsSection">
                <h2>✅ Emails envoyés</h2>
                <div class="result-stats" id="resultStats"></div>
                <div class="errors-box" id="errorsBox" style="display:none;">
                    <h4>⚠️ Erreurs</h4>
                    <ul id="errorsList"></ul>
                </div>
                <div class="footer" style="justify-content:center;">
                    <button class="btn-primary" onclick="closeDialog()">Fermer</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let routes = [];

        // ── Init ─────────────────────────────────────────────────
        window.addEventListener('load', () => {
            google.script.run
                .withSuccessHandler(renderRoutes)
                .withFailureHandler(err => showAlert('error', 'Erreur de chargement : ' + err.message))
                .getConfirmedRoutesForSending();
        });

        // ── Render routes ────────────────────────────────────────
        function renderRoutes(data) {
            routes = data || [];
            const list = document.getElementById('routesList');

            if (routes.length === 0) {
                list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3>Aucune route confirmée</h3>
            <p>Confirmez d'abord des routes dans la feuille "routes"<br>
               (statut = Confirmée) avant d'envoyer les emails.</p>
          </div>`;
                document.getElementById('routeCount').textContent = '0 route disponible';
                return;
            }

            document.getElementById('routeCount').textContent =
                `${routes.length} route${routes.length > 1 ? 's' : ''} confirmée${routes.length > 1 ? 's' : ''}`;

            list.innerHTML = routes.map((r, i) => `
        <div class="route-card" id="card-${i}" onclick="toggleCard(${i})">
          <input type="checkbox" id="chk-${i}" value="${r.id_route}" onchange="onCheck()">
          <div class="route-info">
            <div class="route-id">${r.id_route}</div>
            <div class="route-meta">
              <span class="badge">👤 ${r.benevole_nom || r.id_benevole || '—'}</span>
              <span class="badge">📦 ${r.nombre_livraisons} livraison${r.nombre_livraisons > 1 ? 's' : ''}</span>
              <span class="badge">📏 ${r.distance_km} km</span>
              ${r.date_debut ? `<span class="badge">📅 ${formatDate(r.date_debut)}</span>` : ''}
            </div>
          </div>
          <div class="route-status">Confirmée</div>
        </div>`).join('');

            onCheck(); // init state
        }

        // ── Toggle card ──────────────────────────────────────────
        function toggleCard(i) {
            const chk = document.getElementById(`chk-${i}`);
            chk.checked = !chk.checked;
            onCheck();
        }

        function toggleAll() {
            const boxes = document.querySelectorAll('input[type="checkbox"]');
            const allChecked = [...boxes].every(b => b.checked);
            boxes.forEach(b => { b.checked = !allChecked; });
            onCheck();
        }

        // ── On checkbox change ───────────────────────────────────
        function onCheck() {
            const selected = getSelectedIds();
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = selected.length === 0;

            // Update card style
            routes.forEach((_, i) => {
                const chk = document.getElementById(`chk-${i}`);
                const card = document.getElementById(`card-${i}`);
                card.classList.toggle('selected', chk.checked);
            });

            // Preview bar
            const bar = document.getElementById('previewBar');
            if (selected.length > 0) {
                const totalDeliveries = selected.reduce((sum, id) => {
                    const r = routes.find(x => x.id_route === id);
                    return sum + (r ? r.nombre_livraisons : 0);
                }, 0);
                bar.style.display = 'block';
                bar.textContent = `📬 ${selected.length} email${selected.length > 1 ? 's' : ''} · ${totalDeliveries} livraison${totalDeliveries > 1 ? 's' : ''} au total`;
            } else {
                bar.style.display = 'none';
            }
        }

        // ── Send ────────────────────────────────────────────────
        function send() {
            const ids = getSelectedIds();
            if (ids.length === 0) return;

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';

            google.script.run
                .withSuccessHandler(showResults)
                .withFailureHandler(err => {
                    document.getElementById('loadingSection').style.display = 'none';
                    document.getElementById('formSection').style.display = 'block';
                    showAlert('error', 'Erreur : ' + err.message);
                })
                .sendRouteEmails(ids);
        }

        // ── Results ──────────────────────────────────────────────
        function showResults(result) {
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';

            document.getElementById('resultStats').innerHTML = `
        <div class="stat-card">
            <div class="num">${result.sent}</div>
            <div class="label">Email${result.sent > 1 ? 's' : ''} envoyé${result.sent > 1 ? 's' : ''}</div>
        </div>
        <div class="stat-card">
            <div class="num">${result.errors.length}</div>
            <div class="label">Erreur${result.errors.length > 1 ? 's' : ''}</div>
        </div>`;

            if (result.errors.length > 0) {
                const errBox = document.getElementById('errorsBox');
                const errList = document.getElementById('errorsList');
                errBox.style.display = 'block';
                errList.innerHTML = result.errors.map(e => `<li>${e}</li>`).join('');
            }
        }

        // ── Helpers ──────────────────────────────────────────────
        function getSelectedIds() {
            return [...document.querySelectorAll('input[type="checkbox"]:checked')]
                .map(b => b.value);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleDateString('fr-FR', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });
            } catch (_) { return dateStr; }
        }

        function showAlert(type, msg) {
            const el = document.getElementById('alert' + type.charAt(0).toUpperCase() + type.slice(1));
            if (!el) return;
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 6000);
        }

        function closeDialog() {
            google.script.host.close();
        }
    </script>
</body>

</html>
