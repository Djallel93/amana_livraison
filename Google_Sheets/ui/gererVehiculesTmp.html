<!DOCTYPE html>
<html lang="fr">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <?!= include('styles'); ?>
</head>

<body>
    <div class="page-wrap">
        <div class="card">

            <div class="form-header">
                <div class="form-header__icon">🚗</div>
                <div class="form-header__text">
                    <h1>Véhicules Temporaires</h1>
                    <p>Ajouter un véhicule disponible pour une période</p>
                </div>
            </div>

            <!-- FORM STATE -->
            <div id="formState">
                <div class="form-body">
                    <div id="alert-success" class="alert alert--success"></div>
                    <div id="alert-error" class="alert alert--error"></div>

                    <form id="tmpVehicleForm">
                        <div class="form-section">
                            <div class="form-section__title">🚙 Type de véhicule</div>
                            <div class="form-group">
                                <label for="id_type_vehicule">Véhicule</label>
                                <div id="type-loading" class="help-text">Chargement des types…</div>
                                <select id="id_type_vehicule" style="display:none;" required>
                                    <option value="">-- Sélectionner --</option>
                                </select>
                                <div class="help-text">Seuls les véhicules avec capacité &gt; 0 sont listés.</div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section__title">📅 Disponibilité</div>
                            <div class="form-group">
                                <label for="disponibilite_debut">Disponible à partir du</label>
                                <input type="datetime-local" id="disponibilite_debut" required>
                            </div>
                            <div class="form-group">
                                <label for="disponibilite_fin">Disponible jusqu'au</label>
                                <input type="datetime-local" id="disponibilite_fin" required>
                            </div>
                            <div class="form-group mb-0">
                                <div class="checkbox-row" onclick="toggleCheck()">
                                    <input type="checkbox" id="actif" checked>
                                    <label for="actif">Actif (disponible pour planification)</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn btn--secondary"
                        onclick="google.script.host.close()">Annuler</button>
                    <button type="submit" form="tmpVehicleForm" class="btn btn--primary" id="submitBtn" disabled>💾
                        Ajouter</button>
                </div>
            </div>

            <!-- LOADING STATE -->
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <div class="loading-state__text">Enregistrement en cours…</div>
            </div>

        </div>
    </div>

    <script>
        window.addEventListener('load', function () {
            google.script.run
                .withSuccessHandler(populateTypes)
                .withFailureHandler(function (e) { document.getElementById('type-loading').textContent = 'Erreur : ' + e.message; })
                .getVehicleTypesForForm();
        });

        function populateTypes(types) {
            document.getElementById('type-loading').style.display = 'none';
            var sel = document.getElementById('id_type_vehicule');
            sel.style.display = '';
            if (!types || types.length === 0) { sel.innerHTML = '<option value="">Aucun type disponible</option>'; return; }
            types.forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                sel.appendChild(opt);
            });
            document.getElementById('submitBtn').disabled = false;
        }

        function toggleCheck() {
            var cb = document.getElementById('actif');
            cb.checked = !cb.checked;
        }

        document.getElementById('tmpVehicleForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var debut = document.getElementById('disponibilite_debut').value;
            var fin = document.getElementById('disponibilite_fin').value;
            if (!debut || !fin) { showAlert('error', 'Les deux dates sont obligatoires.'); return; }
            if (new Date(fin) <= new Date(debut)) { showAlert('error', 'La date de fin doit être après la date de début.'); return; }
            setState('loading');
            google.script.run
                .withSuccessHandler(function (r) {
                    if (r.success) { setState('form'); showAlert('success', '✅ Véhicule ' + r.id + ' ajouté !'); setTimeout(function () { google.script.host.close(); }, 1800); }
                    else { setState('form'); showAlert('error', r.error || 'Erreur inconnue.'); }
                })
                .withFailureHandler(function (e) { setState('form'); showAlert('error', 'Erreur : ' + e.message); })
                .saveTmpVehicleFromForm({
                    id_type_vehicule: document.getElementById('id_type_vehicule').value,
                    disponibilite_debut: debut,
                    disponibilite_fin: fin,
                    actif: document.getElementById('actif').checked
                });
        });

        function setState(s) {
            document.getElementById('formState').style.display = s === 'form' ? '' : 'none';
            document.getElementById('loadingState').classList.toggle('loading-state--visible', s === 'loading');
        }

        function showAlert(type, msg) {
            var el = document.getElementById('alert-' + type);
            el.textContent = msg;
            el.classList.add('alert--visible', 'alert--' + type);
            setTimeout(function () { el.classList.remove('alert--visible'); }, 5000);
        }
    </script>
</body>

</html>
