<!DOCTYPE html>
<html lang="fr">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <?!= include('styles'); ?>
</head>

<body>
  <div class="page-wrap">
    <div class="card">

      <div class="form-header">
        <div class="form-header__icon">🏷️</div>
        <div class="form-header__text">
          <h1>Générer les Étiquettes</h1>
          <p>Créer des étiquettes imprimables avec QR codes pour les colis</p>
        </div>
      </div>

      <!-- FORM STATE -->
      <div id="formState">
        <div class="form-body">
          <div id="alert-success" class="alert alert--success"></div>
          <div id="alert-error" class="alert alert--error"></div>

          <form id="labelsForm">

            <div class="form-section">
              <div class="form-section__title">📐 Format A4</div>
              <div class="form-row">
                <div class="form-group mb-0">
                  <label for="rows">Lignes par page</label>
                  <input type="number" id="rows" min="1" max="15" value="7" required>
                </div>
                <div class="form-group mb-0">
                  <label for="cols">Colonnes par page</label>
                  <input type="number" id="cols" min="1" max="5" value="3" required>
                </div>
              </div>
              <div
                style="margin-top: 14px; padding: 14px; background: var(--bg2); border-radius: var(--radius); text-align: center; border: 1px solid var(--border);">
                <div style="font-weight: 600; font-size: 13px; color: var(--text-2); margin-bottom: 10px;"
                  id="format-display">7×3 = 21 étiquettes par page</div>
                <div class="label-preview-grid" id="grid-preview"></div>
              </div>
            </div>

            <div class="form-section">
              <div class="form-section__title">📍 Routes à étiqueter</div>
              <div class="toolbar">
                <span class="toolbar__title" id="routeCount">Chargement…</span>
                <button type="button" class="text-link" onclick="toggleSelectAll()">✓ Tout sélectionner /
                  désélectionner</button>
              </div>
              <div class="scroll-list" id="routes-container">
                <div class="loading-state loading-state--visible" style="padding: 32px 0;">
                  <div class="spinner"></div>
                </div>
              </div>
            </div>

            <!-- Preview stats -->
            <div id="preview-section" class="hidden">
              <div class="kpi-grid" style="margin-bottom: 0;">
                <div class="kpi-card">
                  <div class="kpi-card__value" id="preview-labels">0</div>
                  <div class="kpi-card__label">Étiquettes</div>
                </div>
                <div class="kpi-card">
                  <div class="kpi-card__value" id="preview-pages">0</div>
                  <div class="kpi-card__label">Pages A4</div>
                </div>
                <div class="kpi-card">
                  <div class="kpi-card__value" id="preview-routes">0</div>
                  <div class="kpi-card__label">Routes</div>
                </div>
              </div>
            </div>

          </form>
        </div>

        <div class="form-footer">
          <button type="button" class="btn btn--secondary" onclick="google.script.host.close()">Annuler</button>
          <button type="submit" form="labelsForm" class="btn btn--primary" id="submitBtn" disabled>✨ Générer les
            Étiquettes</button>
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <div class="loading-state__text">Génération en cours…</div>
        <div class="loading-state__sub">Création des documents Google avec QR codes</div>
      </div>

      <!-- RESULTS STATE -->
      <div id="resultsState" class="results-state">
        <div class="results-header">
          <h2>✅ Étiquettes générées</h2>
        </div>
        <div class="results-body">
          <div id="documents-list"></div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn--primary" onclick="google.script.host.close()">Fermer</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    var routes = [];

    window.addEventListener('load', function () {
      loadConfirmedRoutes();
      updateGridPreview();
      document.getElementById('rows').addEventListener('input', updateFormatDisplay);
      document.getElementById('cols').addEventListener('input', updateFormatDisplay);
    });

    function loadConfirmedRoutes() {
      google.script.run
        .withSuccessHandler(displayRoutes)
        .withFailureHandler(function (e) {
          document.getElementById('routes-container').innerHTML =
            '<div class="empty-state"><div class="empty-state__icon">⚠️</div><h3>Erreur de chargement</h3><p>' + e.message + '</p></div>';
        })
        .getConfirmedRoutesForLabels();
    }

    function displayRoutes(data) {
      routes = data || [];
      var container = document.getElementById('routes-container');
      document.getElementById('routeCount').textContent = routes.length + ' route' + (routes.length > 1 ? 's' : '') + ' disponible' + (routes.length > 1 ? 's' : '');

      if (routes.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state__icon">📭</div><h3>Aucune route confirmée</h3><p>Les routes doivent être confirmées avant de générer les étiquettes.</p></div>';
        return;
      }

      container.innerHTML = routes.map(function (r, i) {
        return '<div class="route-card" id="card-' + i + '" onclick="toggleRoute(' + i + ', event)">' +
          '<input type="checkbox" id="route-' + i + '" value="' + r.id_route + '" onchange="updatePreview()">' +
          '<div class="route-card__info">' +
          '<div class="route-card__id">' + r.id_route + '</div>' +
          '<div class="route-card__meta">' +
          '<span class="route-card__badge">📦 ' + (r.nombre_livraisons || 0) + ' livraisons</span>' +
          '<span class="route-card__badge">🏷️ ' + (r.total_personnes || 0) + ' étiquettes</span>' +
          '</div>' +
          '</div>' +
          '<span class="route-card__status">Confirmée</span>' +
          '</div>';
      }).join('');
    }

    function toggleRoute(i, event) {
      if (event.target.type === 'checkbox') return;
      var cb = document.getElementById('route-' + i);
      cb.checked = !cb.checked;
      updatePreview();
    }

    function toggleSelectAll() {
      var boxes = document.querySelectorAll('#routes-container input[type="checkbox"]');
      var allChecked = Array.from(boxes).every(function (b) { return b.checked; });
      boxes.forEach(function (b) { b.checked = !allChecked; });
      updatePreview();
    }

    function updateFormatDisplay() {
      var rows = parseInt(document.getElementById('rows').value) || 7;
      var cols = parseInt(document.getElementById('cols').value) || 3;
      document.getElementById('format-display').textContent = rows + '×' + cols + ' = ' + (rows * cols) + ' étiquettes par page';
      updateGridPreview();
      updatePreview();
    }

    function updateGridPreview() {
      var rows = parseInt(document.getElementById('rows').value) || 7;
      var cols = parseInt(document.getElementById('cols').value) || 3;
      var grid = document.getElementById('grid-preview');
      grid.style.gridTemplateColumns = 'repeat(' + cols + ', 56px)';
      grid.style.gridTemplateRows = 'repeat(' + rows + ', 38px)';
      grid.innerHTML = '';
      for (var i = 0; i < rows * cols; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = i + 1;
        grid.appendChild(cell);
      }
    }

    function updatePreview() {
      var selected = Array.from(document.querySelectorAll('#routes-container input:checked'));
      document.getElementById('submitBtn').disabled = selected.length === 0;

      selected.forEach(function (_, i) { });
      routes.forEach(function (_, i) {
        var cb = document.getElementById('route-' + i);
        var card = document.getElementById('card-' + i);
        if (cb && card) card.classList.toggle('selected', cb.checked);
      });

      if (selected.length === 0) { document.getElementById('preview-section').classList.add('hidden'); return; }

      var totalLabels = 0;
      selected.forEach(function (cb) {
        var r = routes.find(function (x) { return x.id_route === cb.value; });
        if (r) totalLabels += r.total_personnes || 0;
      });
      var rows = parseInt(document.getElementById('rows').value) || 7;
      var cols = parseInt(document.getElementById('cols').value) || 3;
      document.getElementById('preview-labels').textContent = totalLabels;
      document.getElementById('preview-pages').textContent = Math.ceil(totalLabels / (rows * cols));
      document.getElementById('preview-routes').textContent = selected.length;
      document.getElementById('preview-section').classList.remove('hidden');
    }

    document.getElementById('labelsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var routeIds = Array.from(document.querySelectorAll('#routes-container input:checked')).map(function (b) { return b.value; });
      if (routeIds.length === 0) { showAlert('error', 'Veuillez sélectionner au moins une route'); return; }
      setState('loading');
      google.script.run
        .withSuccessHandler(onGenerateSuccess)
        .withFailureHandler(function (e) { setState('form'); showAlert('error', 'Erreur : ' + e.message); })
        .generateLabelsFromForm({ routeIds: routeIds, rows: parseInt(document.getElementById('rows').value), cols: parseInt(document.getElementById('cols').value) });
    });

    function onGenerateSuccess(result) {
      if (!result.success) { setState('form'); showAlert('error', 'La génération a échoué : ' + (result.errors.join(', ') || 'Erreur inconnue')); return; }
      var list = document.getElementById('documents-list');
      list.innerHTML = '';
      result.documents.forEach(function (doc) {
        list.innerHTML +=
          '<div class="doc-item">' +
          '<div><div class="doc-item__label">' + doc.routeId + '</div><div class="doc-item__sub">' + doc.labelCount + ' étiquettes</div></div>' +
          '<a href="' + doc.url + '" target="_blank">📄 Ouvrir le document</a>' +
          '</div>';
      });
      setState('results');
    }

    function setState(s) {
      document.getElementById('formState').style.display = s === 'form' ? '' : 'none';
      document.getElementById('loadingState').classList.toggle('loading-state--visible', s === 'loading');
      document.getElementById('resultsState').classList.toggle('results-state--visible', s === 'results');
    }

    function showAlert(type, msg) {
      var el = document.getElementById('alert-' + type);
      el.textContent = msg;
      el.classList.add('alert--visible', 'alert--' + type);
      setTimeout(function () { el.classList.remove('alert--visible'); }, 6000);
    }
  </script>
</body>

</html>
