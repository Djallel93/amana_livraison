<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuille de Conditionnement</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f8;
            padding: 24px;
            color: #2d3748;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #2d3748;
        }

        .subtitle {
            font-size: 13px;
            color: #718096;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            background: #fff;
            transition: border-color 0.2s;
        }

        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.88;
        }

        #btnGenerate {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        #btnCancel {
            background: #e2e8f0;
            color: #4a5568;
        }

        #status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        #status.loading {
            background: #ebf8ff;
            color: #2c5282;
            border-left: 4px solid #3182ce;
            display: block;
        }

        #status.success {
            background: #f0fff4;
            color: #22543d;
            border-left: 4px solid #38a169;
            display: block;
        }

        #status.error {
            background: #fff5f5;
            color: #742a2a;
            border-left: 4px solid #e53e3e;
            display: block;
        }

        .link-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #38a169;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <h2>📦 Feuille de Conditionnement</h2>
    <p class="subtitle">
        Génère une feuille Google Sheets avec les livraisons du jour,
        incluant un QR code par colis pour l'équipe de conditionnement.
    </p>

    <div class="form-group">
        <label for="date">Date de livraison</label>
        <input type="date" id="date" required />
    </div>

    <div class="form-group">
        <label for="occasion">Occasion</label>
        <select id="occasion">
            <option value="zakat_el_fitr">🌙 Zakat El Fitr</option>
            <option value="recolte">🌾 Récolte</option>
            <option value="ponctuelle">📦 Ponctuelle</option>
        </select>
    </div>

    <div class="actions">
        <button id="btnGenerate" onclick="generate()">🚀 Générer la feuille</button>
        <button id="btnCancel" onclick="google.script.host.close()">Annuler</button>
    </div>

    <div id="status"></div>

    <script>
        // Pré-remplir avec la date d'aujourd'hui
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        function setStatus(type, message) {
            const el = document.getElementById('status');
            el.className = type;
            el.innerHTML = message;
        }

        function generate() {
            const date = document.getElementById('date').value;
            const occasion = document.getElementById('occasion').value;

            if (!date) {
                setStatus('error', '⚠️ Veuillez sélectionner une date.');
                return;
            }

            setStatus('loading', '⏳ Génération en cours...');
            document.getElementById('btnGenerate').disabled = true;

            google.script.run
                .withSuccessHandler(function (result) {
                    document.getElementById('btnGenerate').disabled = false;

                    if (result.success) {
                        setStatus('success',
                            `✅ Feuille générée avec succès — <strong>${result.count}</strong> livraison(s).<br>
                <a class="link-btn" href="${result.url}" target="_blank">📂 Ouvrir la feuille</a>`
                        );
                    } else {
                        const errors = (result.errors || []).join('<br>');
                        setStatus('error', `❌ Erreur : ${errors}`);
                    }
                })
                .withFailureHandler(function (err) {
                    document.getElementById('btnGenerate').disabled = false;
                    setStatus('error', `❌ Erreur inattendue : ${err.message}`);
                })
                .generatePackagingSheetFromForm({ date, occasion });
        }
    </script>

</body>

</html>
